<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" role="img" aria-label="System diagram. On the left, data sources: scan files uploaded in the browser, the Nessus scanner reached privately over Tailscale, threat intelligence feeds, GitHub and security news, and an optional AI provider. In the middle, one service: vmt serve hosts the dashboard and a scheduler; both run vmt commands, which read and write the /data volume. On the right, what it reaches: the team over HTTPS with sign-in, alert channels, weekly CEO and CISO reports, ticketing systems, and off-site encrypted backups.">
<style>
  svg { --bg:#FFFFFF; --fg:#13233F; --muted:#5A6B85; --rule:#DCE3ED; --signal:#2F6FED; --tailnet:#0E8A7C;
        --fail:#C4321F; --tint:rgba(47,111,237,0.07); --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#121D33; --fg:#E3EAF5; --muted:#9AABC6; --rule:#2A3B58; --signal:#6B9BFF; --tailnet:#3CC7B5;
          --fail:#FF7A66; --tint:rgba(107,155,255,0.10); }
  }
  .bg { fill: var(--bg); }
  text { font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
  .t { font-size: 13px; font-weight: 600; }
  .s { font-size: 11px; fill: var(--muted); }
  .lbl { font-size: 10.5px; fill: var(--muted); }
  .head { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; fill: var(--muted); }
  .box { fill: var(--bg); stroke: var(--rule); stroke-width: 1.5; }
  .soft { fill: var(--tint); stroke: none; }
  .group { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 6 5; }
  .edge { fill: none; stroke: var(--fg); stroke-width: 1.5; opacity: 0.75; }
  .edge.tn { stroke: var(--tailnet); opacity: 1; stroke-width: 2.2; }
  .edge.web { stroke: var(--signal); opacity: 1; stroke-width: 2.2; }
  .edge.fail { stroke: var(--fail); opacity: 1; stroke-width: 2; stroke-dasharray: 5 4; }
  .chip { fill: var(--tint); stroke: var(--signal); stroke-width: 1; }
  .chip.cond { stroke-dasharray: 4 3; }
  .lane-tn { fill: var(--tailnet); } .lane-web { fill: var(--signal); } .lane-fail { fill: var(--fail); }
  .mark { fill: var(--fg); opacity: 0.75; }
</style>
<rect class="bg" x="0" y="0" width="1240" height="740" rx="14"/>
    <defs>
      <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mark"/></marker>
      <marker id="arw-tn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="lane-tn"/></marker>
      <marker id="arw-web" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="lane-web"/></marker>
    </defs>

    <!-- column headings -->
    <text x="24" y="30" class="head">WHERE DATA COMES FROM</text>
    <text x="960" y="30" class="head">WHO AND WHAT IT REACHES</text>

    <!-- the service boundary -->
    <rect x="300" y="44" width="600" height="664" rx="14" class="group"/>
    <text x="318" y="68" class="head">ONE SERVICE · RAILWAY TODAY · RUNS AS A NON-ROOT USER</text>

    <!-- left: sources -->
    <rect x="24" y="111" width="220" height="54" rx="10" class="box"/>
    <text x="40" y="134" class="t">Scan files</text><text x="40" y="152" class="s">OpenVAS, Trivy, .nessus</text>

    <rect x="24" y="181" width="220" height="54" rx="10" class="box"/>
    <text x="40" y="204" class="t">Nessus scanner</text><text x="40" y="222" class="s">inside your network</text>

    <rect x="24" y="316" width="220" height="60" rx="10" class="box"/>
    <text x="40" y="338" class="t">Threat intelligence</text><text x="40" y="356" class="s">CISA KEV · EPSS · NVD</text><text x="40" y="370" class="s">Exploit-DB · Metasploit · OSV</text>

    <rect x="24" y="392" width="220" height="44" rx="10" class="box"/>
    <text x="40" y="419" class="t">GitHub &amp; security news</text>

    <rect x="24" y="452" width="220" height="50" rx="10" class="box"/>
    <text x="40" y="473" class="t">AI provider</text><text x="40" y="490" class="s">optional, off until configured</text>

    <!-- vmt serve -->
    <rect x="530" y="84" width="350" height="172" rx="12" class="soft"/>
    <text x="545" y="102" class="head">VMT SERVE</text>
    <rect x="545" y="111" width="320" height="54" rx="10" class="box"/>
    <text x="561" y="134" class="t">Dashboard</text><text x="561" y="152" class="s">Streamlit · sign-in · 26 pages</text>
    <rect x="545" y="181" width="320" height="54" rx="10" class="box"/>
    <text x="561" y="204" class="t">Scheduler</text><text x="561" y="222" class="s">starts the daily routine at the set time</text>

    <!-- Tailscale -->
    <rect x="320" y="181" width="180" height="54" rx="10" class="box"/>
    <text x="336" y="204" class="t">Tailscale</text><text x="336" y="222" class="s">userspace · proxy on :1055</text>

    <!-- commands -->
    <rect x="320" y="310" width="560" height="200" rx="12" class="box"/>
    <text x="338" y="334" class="t">vmt commands</text><text x="438" y="334" class="s">each runs as its own process</text>
    <g>
      <rect x="338" y="350" width="80" height="34" rx="8" class="chip"/><text x="378" y="371" class="s" text-anchor="middle">Pull</text>
      <rect x="428" y="350" width="80" height="34" rx="8" class="chip"/><text x="468" y="371" class="s" text-anchor="middle">Enrich</text>
      <rect x="518" y="350" width="80" height="34" rx="8" class="chip"/><text x="558" y="371" class="s" text-anchor="middle">Dedupe</text>
      <rect x="608" y="350" width="80" height="34" rx="8" class="chip"/><text x="648" y="371" class="s" text-anchor="middle">Prioritize</text>
      <rect x="698" y="350" width="80" height="34" rx="8" class="chip"/><text x="738" y="371" class="s" text-anchor="middle">Plan</text>
      <rect x="788" y="350" width="80" height="34" rx="8" class="chip"/><text x="828" y="371" class="s" text-anchor="middle">Forecast</text>
      <rect x="338" y="396" width="80" height="34" rx="8" class="chip"/><text x="378" y="417" class="s" text-anchor="middle">History</text>
      <rect x="428" y="396" width="80" height="34" rx="8" class="chip"/><text x="468" y="417" class="s" text-anchor="middle">Monitor</text>
      <rect x="518" y="396" width="80" height="34" rx="8" class="chip"/><text x="558" y="417" class="s" text-anchor="middle">Backup</text>
      <rect x="608" y="396" width="80" height="34" rx="8" class="chip"/><text x="648" y="417" class="s" text-anchor="middle">Alerts</text>
      <rect x="698" y="396" width="80" height="34" rx="8" class="chip cond"/><text x="738" y="417" class="s" text-anchor="middle">Report</text>
      <rect x="788" y="396" width="80" height="34" rx="8" class="chip cond"/><text x="828" y="417" class="s" text-anchor="middle">Tickets</text>
    </g>
    <text x="338" y="458" class="s">The daily routine runs the solid steps in order. Dashed steps run when due or when asked.</text>
    <text x="338" y="476" class="s">Triage, Ask and the other tools run on demand from the dashboard.</text>

    <!-- volume -->
    <rect x="320" y="560" width="560" height="132" rx="12" class="box"/>
    <text x="338" y="584" class="t">/data volume</text><text x="438" y="584" class="s">written by commands; the dashboard's charts read it</text>
    <text x="338" y="612" class="s"><tspan class="mono" style="font-family:var(--mono)">vmt.db</tspan> · SQLite, 33 tables</text>
    <text x="620" y="612" class="s"><tspan style="font-family:var(--mono)">raw/</tspan> · original Nessus exports</text>
    <text x="338" y="640" class="s"><tspan style="font-family:var(--mono)">reports/</tspan> · CEO and CISO PDFs</text>
    <text x="620" y="640" class="s"><tspan style="font-family:var(--mono)">backups/</tspan> · 14 dated copies</text>
    <text x="338" y="668" class="s"><tspan style="font-family:var(--mono)">logs/</tspan> · one file per daily run</text>
    <text x="620" y="668" class="s"><tspan style="font-family:var(--mono)">tailscale/</tspan> · node identity</text>

    <!-- right: who and what it reaches -->
    <rect x="960" y="111" width="256" height="54" rx="10" class="box"/>
    <text x="976" y="134" class="t">Your team</text><text x="976" y="152" class="s">any browser, any device</text>

    <rect x="960" y="318" width="256" height="48" rx="10" class="box"/>
    <text x="976" y="338" class="t">Alert channels</text><text x="976" y="355" class="s">Slack · email · log file</text>

    <rect x="960" y="388" width="256" height="48" rx="10" class="box"/>
    <text x="976" y="408" class="t">CEO and CISO reports</text><text x="976" y="425" class="s">PDF, reviewed and sent by you</text>

    <rect x="960" y="458" width="256" height="48" rx="10" class="box"/>
    <text x="976" y="478" class="t">Ticketing</text><text x="976" y="495" class="s">Jira · ServiceNow · files</text>

    <rect x="960" y="602" width="256" height="52" rx="10" class="box"/>
    <text x="976" y="623" class="t">Off-site backups</text><text x="976" y="641" class="s">S3-compatible or Azure Blob</text>

    <!-- edges: sources in -->
    <line x1="244" y1="138" x2="541" y2="138" class="edge" marker-end="url(#arw)"/>
    <text x="392" y="131" class="lbl" text-anchor="middle">upload in the browser</text>

    <line x1="244" y1="208" x2="316" y2="208" class="edge tn" marker-end="url(#arw-tn)"/>
    <text x="272" y="200" class="lbl" text-anchor="middle">tailnet</text>
    <polyline points="410,235 410,306" class="edge tn" marker-end="url(#arw-tn)"/>
    <text x="418" y="276" class="lbl">HTTPS via proxy</text>

    <line x1="705" y1="256" x2="705" y2="306" class="edge" marker-end="url(#arw)"/>
    <text x="713" y="286" class="lbl">runs commands</text>

    <line x1="244" y1="346" x2="316" y2="346" class="edge" marker-end="url(#arw)"/>
    <text x="272" y="339" class="lbl" text-anchor="middle">cached</text>
    <line x1="244" y1="414" x2="316" y2="414" class="edge" marker-end="url(#arw)"/>
    <text x="272" y="407" class="lbl" text-anchor="middle">search</text>
    <line x1="316" y1="477" x2="248" y2="477" class="edge" marker-end="url(#arw)"/>
    <text x="272" y="470" class="lbl" text-anchor="middle">redacted</text>

    <line x1="600" y1="510" x2="600" y2="556" class="edge" marker-start="url(#arw)" marker-end="url(#arw)"/>
    <text x="610" y="538" class="lbl">reads and writes</text>

    <!-- edges: out -->
    <line x1="869" y1="138" x2="956" y2="138" class="edge web" marker-start="url(#arw-web)" marker-end="url(#arw-web)"/>
    <text x="930" y="130" class="lbl" text-anchor="middle">HTTPS</text><text x="930" y="156" class="lbl" text-anchor="middle">sign-in</text>

    <line x1="880" y1="342" x2="956" y2="342" class="edge" marker-end="url(#arw)"/>
    <text x="930" y="335" class="lbl" text-anchor="middle">alert</text>
    <line x1="880" y1="412" x2="956" y2="412" class="edge" marker-end="url(#arw)"/>
    <text x="930" y="405" class="lbl" text-anchor="middle">weekly</text>
    <line x1="880" y1="482" x2="956" y2="482" class="edge" marker-end="url(#arw)"/>
    <text x="930" y="475" class="lbl" text-anchor="middle">opt-in</text>
    <line x1="880" y1="628" x2="956" y2="628" class="edge" marker-end="url(#arw)"/>
    <text x="930" y="621" class="lbl" text-anchor="middle">encrypted</text>
  
  <line x1="24" y1="722" x2="48" y2="722" class="edge tn"/><text x="56" y="726" class="lbl">private route to Nessus, never on the public internet</text>
  <line x1="372" y1="722" x2="396" y2="722" class="edge web"/><text x="404" y="726" class="lbl">the only way in from the internet</text>
  <line x1="620" y1="722" x2="644" y2="722" class="edge"/><text x="652" y="726" class="lbl">everything else</text>
</svg>
